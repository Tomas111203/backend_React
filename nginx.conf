server {
    listen 8000;
    server_name _;

    # 1. Desactivar versión y firmas
    server_tokens off;

    # 2. Reemplazar o limpiar la cabecera Server
    proxy_hide_header Server;
    add_header Server "webserver" always;

    # 3. Páginas de error genéricas (evita la página default con logo/texto de nginx)
    error_page 400 401 403 404 405 500 502 503 504 = @error_json;

    location @error_json {
        default_type application/json;
        return 404 '{"error": "Not Found"}';
    }

    location / {
        # 4. Mitigación [options-method]: rechazar escaneos directos de OPTIONS
        # Solo se permite OPTIONS si es un preflight CORS legítimo (trae Access-Control-Request-Method)
        set $check_options "";
        if ($request_method = OPTIONS) {
            set $check_options "O";
        }
        if ($http_access_control_request_method = "") {
            set $check_options "${check_options}N";
        }
        if ($check_options = "ON") {
            return 405;
        }

        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
