services:
  # ==========================================
  # SERVICIOS DE AUTENTICACIÓN: auth-ldap-oauth2
  # ==========================================
  openldap2:
    image: osixia/openldap:1.5.0
    container_name: openldap2
    environment:
      LDAP_ORGANISATION: "Example Corp"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "adminpassword"
    expose:
      - "389"
      - "636"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    networks: [auth-network]

  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: phpldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap2"
      PHPLDAPADMIN_HTTPS: "false"
    expose:
      - "80"
    depends_on: [openldap2]
    networks: [auth-network]

  ldap-proxy:
    build: ./ldap-proxy
    container_name: ldap-proxy
    ports:
      - "389:389"
      - "636:636"
      - "8080:8080"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on: [openldap2, phpldapadmin]
    networks: [auth-network]

  postgres:
    image: postgres:16-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloakpassword
    volumes:
      - keycloak_db:/var/lib/postgresql/data
    networks: [auth-network]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: adminpassword
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloakpassword
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8081:8080"
    volumes:
      - ../auth-ldap-oauth2/keycloak/import:/opt/keycloak/data/import:ro
    depends_on: [postgres, openldap2]
    networks: [auth-network]

  # ==========================================
  # SERVICIOS BACKEND & BASE DE DATOS SQL: backend
  # ==========================================
  videogames-db:
    image: postgres:16-alpine
    container_name: videogames-db
    environment:
      POSTGRES_DB: videogames
      POSTGRES_USER: videogames
      POSTGRES_PASSWORD: videogamespassword
    volumes:
      - videogames_db:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    networks: [auth-network]

  videogames-api:
    build: .
    container_name: videogames-api
    ports:
      - "8000:8000"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      ENVIRONMENT: production
      KEYCLOAK_INTERNAL: http://keycloak:8080
      KEYCLOAK_PUBLIC: http://localhost:8081
      KEYCLOAK_REALM: cybersecurity
      KEYCLOAK_CLIENT_ID: fastapi-api
      DB_HOST: videogames-db
      DB_PORT: 5432
      DB_USER: videogames
      DB_PASSWORD: videogamespassword
      DB_NAME: videogames
    depends_on: [keycloak, videogames-db]
    networks: [auth-network]

  # ==========================================
  # SERVICIOS FRONTEND REACT: frontend
  # ==========================================
  videogames-frontend:
    build: ../frontend
    container_name: videogames-frontend
    ports:
      - "3000:80"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on: [videogames-api, keycloak]
    networks: [auth-network]

  # ==========================================
  # SERVICIO DE AUDITORÍA: Nuclei Scanner
  # ==========================================
  nuclei:
    image: projectdiscovery/nuclei:latest
    container_name: nuclei-scanner
    profiles:
      - scan
    volumes:
      - ./reports:/reports
      - nuclei-templates:/root/nuclei-templates
    networks:
      - auth-network
    entrypoint: ["nuclei"]
    command:
      - "-target"
      - "http://videogames-api:8000"
      - "-severity"
      - "low,medium,high,critical"
      - "-jsonl-export"
      - "/reports/nuclei-results.jsonl"
      - "-o"
      - "/reports/nuclei-report.txt"


volumes:
  ldap_data:
  ldap_config:
  keycloak_db:
  videogames_db:
  nuclei-templates:
    external: true
    name: nuclei-templates

networks:
  auth-network:
    driver: bridge
